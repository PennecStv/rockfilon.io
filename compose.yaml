# Dev : `docker compose up` -> API sur http://localhost:8000 (le front s'ajoute à l'étape 4)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rockfilon
      POSTGRES_PASSWORD: rockfilon
      POSTGRES_DB: rockfilon
    ports: ["5432:5432"]
    volumes:
      - db:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "rockfilon"]
      interval: 2s
      retries: 15

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://rockfilon:rockfilon@db:5432/rockfilon
    # migrations + chargement du contenu construit, puis rechargement à chaud du code
    command: sh -c "alembic upgrade head && rockfilon load && uvicorn rockfilon.api:app --host 0.0.0.0 --reload"
    ports: ["8000:8000"]
    volumes:
      - ./rockfilon:/app/rockfilon
      - ./content:/app/content
      - ./alembic:/app/alembic
    depends_on:
      db: { condition: service_healthy }

volumes:
  db:
