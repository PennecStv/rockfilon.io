[project]
name = "rockfilon"
version = "0.1.0"
description = "Jeu quotidien de culture générale : creuse avec des réponses rares."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
]

[project.scripts]
rockfilon = "rockfilon.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
